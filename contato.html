            <fieldset>
            <label for = "motivo">Como você conheceu o site? 1.Indicação de um amigo</label>

            <label for = "Redes sociais">2.Redes Sociais</label>

            <label for = "Comercial">4.Comercial do site</label>
            <input type="radio" id="Comercial" name="Motivo"> 
            </fieldset>

            <fieldset>
            <label for = "letter">Deseja receber um E-mail? 1.sim</label>
            <input type="checkbox" id="letter" name="Motivo">

            <input type="checkbox" id="letter" name="Motivo">

            <fieldset>
            mensagem

            </fieldset>

            </fieldset>

            
           </form>
